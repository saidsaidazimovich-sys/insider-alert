name: reconcile

# The 15-minute feed poll can miss filings during the post-close rush, because
# the getcurrent feed only holds the most recent few hundred entries. This job
# re-reads the whole day from EDGAR's daily index so nothing is lost.
# One run a day, so the quota cost is negligible.
on:
  schedule:
    - cron: "30 3 * * 2-6"      # 23:30 ET, after EDGAR closes for the day
  workflow_dispatch:
    inputs:
      day:
        description: "Day to reconcile (YYYY-MM-DD). Defaults to yesterday ET."
        type: string

concurrency:
  group: insider-monitor        # shares the group so it cannot race the poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Reconcile day
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DAY="${{ inputs.day }}"
          if [[ -z "$DAY" ]]; then
            DAY=$(TZ=America/New_York date -d "yesterday" '+%Y-%m-%d')
          fi
          echo "Reconciling $DAY"
          python run.py --reconcile "$DAY"
      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "insider-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/ && git commit -m "reconcile: $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
